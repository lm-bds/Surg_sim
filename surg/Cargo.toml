[package]
name = "surg"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Reproducible operating-room duration and schedule simulator"
repository = "https://github.com/lm-bds/Surg_sim"

[dependencies]
axum = "0.8"
rand = "0.8"
rand_distr = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
